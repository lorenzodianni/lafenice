# Client preview on GitHub Pages, rebuilt on every push to main.
# Production is not here: it deploys from the Cloudflare Git integration.
# Pages is static hosting, so the forms cannot send (a POST gets a 405).
name: Preview

on:
  push:
    branches: [main]

permissions:
  contents: read

# One deploy at a time. A newer push waits instead of cancelling: a deploy
# cut off halfway can leave the preview broken.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      # The pages link to root paths (/assets/..., /policies/...), but a project
      # site lives under /<repo>/. The preview also stays out of search engines:
      # robots.txt only counts at the root of github.io, so a meta tag it is.
      # React writes srcSet in camel case, and a srcset lists its other
      # candidates after ", ". The grep fails the job
      # if a root path is left, e.g. from a hydrated route: extend the sed
      # when it does.
      - name: Rebase the URLs and add noindex
        env:
          BASE: /${{ github.event.repository.name }}/
        run: |
          find build/client \( -name '*.html' -o -name '*.css' \) -exec sed -i -E \
            -e "s#(href|src|srcSet)=\"/([^/])#\1=\"$BASE\2#g" \
            -e "s#, /(assets|images)/#, $BASE\1/#g" \
            -e "s#url\(/([^/])#url($BASE\1#g" \
            -e "s#<head>#<head><meta name=\"robots\" content=\"noindex\">#" {} +
          if grep -rEn '["( ,]/(assets|images)/' build/client --include='*.html' --include='*.css'; then
            echo "::error::root paths left after the rewrite"
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/client

  # Separate job: the Pages token never reaches npm ci and the install
  # scripts of the dependencies.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
